crons:
  - name: daily-hr-leads
    description: "Generates 3 fresh HR prospect leads (LinkedIn/Google links) each morning for every active user"
    cron: "0 7 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/daily-hr-leads"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
