name: Build Windows Desktop App

# Builds the Career Buddha 360 Suite Windows installer (.exe) on a real
# Windows runner — this produces a proper NSIS installer with the branded
# icon embedded (not possible on the Linux/ARM build container).
#
# How to use:
# 1. Push this repo to GitHub (use "Save to GitHub" in Emergent).
# 2. Repo -> Actions -> "Build Windows Desktop App" -> Run workflow.
#    - Leave "publish" = true to create a GitHub Release (enables auto-update).
# 3. Download the installer from the published Release (or from the run's
#    "CareerBuddha360Suite-Installer" artifact) and share it with your team.
#
# Code signing (optional, removes the "unknown publisher" warning):
#   Add repo secrets CSC_LINK (base64 of your .pfx certificate) and
#   CSC_KEY_PASSWORD (its password). When present, the build signs the
#   installer automatically. Without them, the build still succeeds unsigned.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (enables auto-update)"
        type: boolean
        default: true
  push:
    tags:
      - "desktop-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish ${{ (github.ref_type == 'tag' || github.event.inputs.publish == 'true') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CareerBuddha360Suite-Installer
          path: desktop/release/*.exe
          if-no-files-found: error
